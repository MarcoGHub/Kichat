# Render.com deployment blueprint.
# Lets you host Kichat online for free and open it from any phone browser.
# Render reads this file automatically when you create a Blueprint service.
services:
  - type: web
    name: kichat
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      # Uses Google Gemini via its OpenAI-compatible endpoint (works as-is,
      # supports the action/tool system). Swap the URL/model for another
      # OpenAI-compatible provider (e.g. Groq) if you prefer.
      - key: PROVIDER
        value: openai
      - key: OPENAI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: OPENAI_MODEL
        value: gemini-2.5-flash
      # Your secret Gemini API key (from aistudio.google.com) — you enter
      # this in the Render dashboard.
      - key: OPENAI_API_KEY
        sync: false
