<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nikita — Digitaler Begleiter</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖤</text></svg>" />
</head>
<body>
  <div class="app">
    <!-- Stage: the avatar you see on screen -->
    <section class="stage">
      <div class="stage-glow"></div>
      <img id="portrait" class="portrait" alt="Nikita" hidden />
      <div id="avatar" class="avatar"></div>
      <div class="nameplate">
        <span class="name">Nikita</span>
        <span class="status" id="status">bereit</span>
      </div>
      <div class="mood-badge" id="moodBadge">neutral</div>
      <button id="settingsBtn" class="settings-btn" title="Aussehen ändern">⚙</button>
    </section>

    <!-- Appearance settings -->
    <div id="settingsModal" class="modal" hidden>
      <div class="modal-card">
        <h2>Nikitas Aussehen</h2>
        <p>Füge ein fotorealistisches Bild von Nikita ein. Du kannst eine
           Bild-Adresse (URL) einfügen oder ein Bild direkt von deinem Gerät wählen.</p>

        <label for="portraitUrl">Bild-Adresse (URL)</label>
        <div class="row">
          <input id="portraitUrl" type="text" placeholder="https://…/nikita.jpg" />
          <button id="portraitUrlSave" class="primary">Übernehmen</button>
        </div>

        <label for="portraitFile">…oder Bild vom Gerät</label>
        <input id="portraitFile" type="file" accept="image/*" />

        <div class="modal-actions">
          <button id="portraitRemove" class="ghost">Zurück zur Illustration</button>
          <button id="settingsClose" class="primary">Fertig</button>
        </div>
        <p class="hint" id="portraitHint"></p>
      </div>
    </div>

    <!-- Chat + actions -->
    <section class="panel">
      <header class="panel-head">
        <div class="dot" id="providerDot"></div>
        <span id="providerLabel">verbinde…</span>
        <button id="clearBtn" class="ghost" title="Verlauf löschen">⟲</button>
      </header>

      <div class="messages" id="messages"></div>

      <div class="action-feed" id="actionFeed" aria-live="polite"></div>

      <form class="composer" id="composer">
        <input id="input" type="text" autocomplete="off"
               placeholder="Schreib Nikita … (z. B. „merk dir, dass ich Tee mag" oder „sei verspielt")" />
        <button type="submit" id="sendBtn">Senden</button>
      </form>
    </section>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
